<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enlistment Protocol // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="nx-card p-4 p-md-5">
        <div class="nx-card-header-accent mb-4"></div>

        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background: rgba(124, 58, 237, 0.12); border: 1px solid var(--nx-primary-glow);">
            <i class="bi bi-shield-plus text-purple fs-1"></i>
          </div>
          <h3 class="text-white fw-black mb-1">ENLIST IN NEXUS ARENA</h3>
          <p class="text-muted font-tactical small mb-0">ESTABLISH SECURE ESPORTS IDENTITY &amp; OPERATIONAL CLEARANCE</p>
        </div>

        <form id="registerForm" novalidate>
          <!-- Role Selection Cards -->
          <div class="mb-4">
            <label class="form-label font-tactical text-muted small d-block">SELECT OPERATIVE CLASSIFICATION</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="rolePlayer" value="player" checked />
                <label class="btn btn-nx-outline w-100 p-3 text-start d-block" for="rolePlayer">
                  <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="text-white fw-bold font-tactical">PRO CONTENDER</span>
                    <i class="bi bi-controller text-cyan fs-5"></i>
                  </div>
                  <small class="text-muted font-tactical d-block" style="font-size: 0.75rem;">Compete, win prizes, &amp; climb MMR</small>
                </label>
              </div>

              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="roleOrganizer" value="organizer" />
                <label class="btn btn-nx-outline w-100 p-3 text-start d-block" for="roleOrganizer">
                  <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="text-white fw-bold font-tactical">ORGANIZER</span>
                    <i class="bi bi-trophy-fill text-amber fs-5"></i>
                  </div>
                  <small class="text-muted font-tactical d-block" style="font-size: 0.75rem;">Host cups, schedule duels, &amp; verify</small>
                </label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">OPERATIVE GAMERTAG / FULL NAME</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill text-cyan"></i></span>
              <input type="text" class="form-control" id="name" placeholder="e.g. PhoenixV / Alex Mercer" required />
            </div>
            <div class="invalid-feedback text-rose small">Operative designation is required.</div>
          </div>

          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">COMMUNICATION EMAIL</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope-fill text-cyan"></i></span>
              <input type="email" class="form-control" id="email" placeholder="operative@nexusarena.gg" required />
            </div>
            <div class="invalid-feedback text-rose small">A valid email address is required.</div>
          </div>

          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">CONTACT PHONE / DISCORD HANDLE (OPTIONAL)</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-discord text-cyan"></i></span>
              <input type="tel" class="form-control" id="phone" placeholder="e.g. Gamer#1234 or +91 9876543210" />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label font-tactical text-muted small">SECURE ACCESS PASSKEY</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock-fill text-cyan"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6" />
            </div>
            <div class="invalid-feedback text-rose small">Password must be at least 6 characters.</div>
          </div>

          <button type="submit" class="btn btn-nx-primary btn-lg w-100 justify-content-center" id="registerBtn">
            <i class="bi bi-shield-plus"></i> Initialize Enlistment
          </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25 font-tactical">
          <span class="text-muted small">ALREADY POSSESS CLEARANCE?</span>
          <a href="login.html" class="text-cyan text-decoration-none fw-bold ms-1">ACCESS TERMINAL</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('register');

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      password: document.getElementById('password').value,
      role: document.querySelector('input[name="role"]:checked').value,
    };

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Enlisting...';

    try {
      const data = await AuthAPI.register(payload);
      Session.setSession(data);
      showToast(`Enlistment Complete! Welcome to Nexus Arena, ${data.name}.`, 'success');
      setTimeout(() => (window.location.href = 'dashboard.html'), 700);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-shield-plus"></i> Initialize Enlistment';
    }
  });
</script>
</body>
</html>

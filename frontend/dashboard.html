<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5" id="dashboardContainer">
  <div class="nx-spinner-wrap"><div class="nx-spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();
  renderNavbar('dashboard');

  const user = Session.getUser();
  const container = document.getElementById('dashboardContainer');

  async function loadOrganizerDashboard() {
    try {
      const data = await DashboardAPI.organizer();
      const myTournaments = await TournamentAPI.mine();

      container.innerHTML = `
        <!-- Top Command Header -->
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
          <div>
            <span class="nx-badge nx-badge-gold mb-2"><i class="bi bi-shield-shaded me-1"></i> ORGANIZER HEADQUARTERS</span>
            <h2 class="display-6 fw-black text-white mb-0"><span class="text-cyan">//</span> COMMAND CENTER</h2>
            <p class="text-muted font-tactical mb-0">OPERATIONAL INTELLIGENCE & TOURNAMENT MANAGEMENT</p>
          </div>
          <div class="d-flex gap-2">
            <a href="create-tournament.html" class="btn btn-nx-primary">
              <i class="bi bi-plus-circle-fill"></i> Launch Tournament
            </a>
          </div>
        </div>

        <!-- Telemetry Cards -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3">
            <div class="nx-stat-card accent-purple h-100">
              <div class="nx-stat-num">${data.totalTournaments}</div>
              <div class="nx-stat-label"><i class="bi bi-trophy-fill text-purple me-1"></i> Tournaments Created</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="nx-stat-card accent-cyan h-100">
              <div class="nx-stat-num">${data.totalPlayers}</div>
              <div class="nx-stat-label"><i class="bi bi-people-fill text-cyan me-1"></i> Verified Players</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="nx-stat-card accent-emerald h-100">
              <div class="nx-stat-num">${data.totalRegistrations}</div>
              <div class="nx-stat-label"><i class="bi bi-card-checklist text-emerald me-1"></i> Total Applications</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="nx-stat-card accent-amber h-100">
              <div class="nx-stat-num">${data.upcomingMatches.length}</div>
              <div class="nx-stat-label"><i class="bi bi-diagram-3-fill text-amber me-1"></i> Scheduled Duels</div>
            </div>
          </div>
        </div>

        <!-- Tournaments Management Table -->
        <div class="nx-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white font-tactical mb-0"><i class="bi bi-trophy text-cyan me-2"></i> HOSTED TOURNAMENTS</h5>
            <span class="text-muted font-tactical small">${myTournaments.length} REGISTERED IN ROSTER</span>
          </div>

          <div class="table-responsive">
            <table class="table table-nexus align-middle mb-0">
              <thead>
                <tr>
                  <th>Tournament Title</th>
                  <th>Game Title</th>
                  <th>Deployment Date</th>
                  <th>Operational Status</th>
                  <th class="text-end">Command Options</th>
                </tr>
              </thead>
              <tbody>
                ${
                  myTournaments.length === 0
                    ? `<tr><td colspan="5" class="text-center text-muted font-tactical py-4">No active tournament directives launched yet. Click "Launch Tournament" to initiate your first bracket.</td></tr>`
                    : myTournaments.map((t) => `
                    <tr>
                      <td class="fw-bold text-white">${t.name}</td>
                      <td class="text-muted font-tactical"><i class="bi bi-controller text-cyan me-1"></i> ${t.gameName}</td>
                      <td class="font-tactical">${formatDate(t.date)}</td>
                      <td>
                        <span class="nx-badge ${statusBadgeClass(t.status)}">
                          ${t.status === 'Ongoing' ? '<span class="pulse-dot"></span>' : ''} ${t.status}
                        </span>
                      </td>
                      <td class="text-end">
                        <div class="btn-group">
                          <a href="tournament-details.html?id=${t._id}" class="btn btn-nx-outline btn-sm" title="View Hub">
                            <i class="bi bi-eye"></i> Hub
                          </a>
                          <a href="registrations.html?id=${t._id}" class="btn btn-nx-outline btn-sm" title="Roster Review">
                            <i class="bi bi-person-lines-fill"></i> Roster
                          </a>
                          <a href="matches.html?id=${t._id}" class="btn btn-nx-outline btn-sm" title="Match Duels">
                            <i class="bi bi-diagram-3"></i> Matches
                          </a>
                        </div>
                      </td>
                    </tr>
                    `).join('')
                }
              </tbody>
            </table>
          </div>
        </div>

        <!-- Upcoming Match Telemetry -->
        <div class="nx-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white font-tactical mb-0"><i class="bi bi-diagram-3-fill text-amber me-2"></i> ACTIVE MATCH QUEUE</h5>
            <span class="text-muted font-tactical small">NEXT SCHEDULED DUELS</span>
          </div>

          <div class="table-responsive">
            <table class="table table-nexus align-middle mb-0">
              <thead>
                <tr>
                  <th>Tournament</th>
                  <th>Round</th>
                  <th>Matchup (Duel)</th>
                  <th>Scheduled Date &amp; Time</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody>
                ${
                  data.upcomingMatches.length === 0
                    ? `<tr><td colspan="5" class="text-center text-muted font-tactical py-4">No scheduled matches queued. Create matchups inside your tournament control hubs.</td></tr>`
                    : data.upcomingMatches.map((m) => `
                    <tr>
                      <td class="fw-bold text-white">${m.tournament ? m.tournament.name : '-'}</td>
                      <td><span class="nx-badge nx-badge-upcoming">${m.round}</span></td>
                      <td class="font-tactical text-cyan fs-6">
                        ${m.player1 ? m.player1.name : 'TBD'} <span class="text-rose fw-bold mx-1">VS</span> ${m.player2 ? m.player2.name : 'TBD'}
                      </td>
                      <td class="font-tactical text-muted">${formatDate(m.matchDate)} @ ${m.matchTime}</td>
                      <td class="text-end">
                        <a href="matches.html?id=${m.tournament ? m.tournament._id : ''}" class="btn btn-nx-cyan btn-sm">
                          <i class="bi bi-controller"></i> Manage Duel
                        </a>
                      </td>
                    </tr>
                    `).join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;
    } catch (err) {
      renderDashboardError(err);
    }
  }

  async function loadPlayerDashboard() {
    try {
      const data = await DashboardAPI.player();

      container.innerHTML = `
        <!-- Player HUD Header -->
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
          <div>
            <span class="nx-badge nx-badge-upcoming mb-2"><i class="bi bi-lightning-charge-fill me-1"></i> CONTENDER COMMAND HUD</span>
            <h2 class="display-6 fw-black text-white mb-0"><span class="text-cyan">//</span> PLAYER BATTLE RECORD</h2>
            <p class="text-muted font-tactical mb-0">COMPETITIVE METRICS, ROSTER ASSIGNMENTS, AND MATCH SCHEDULE</p>
          </div>
          <div>
            <a href="tournaments.html" class="btn btn-nx-cyan">
              <i class="bi bi-compass"></i> Discover Tournaments
            </a>
          </div>
        </div>

        <!-- Telemetry Cards -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="nx-stat-card accent-cyan h-100">
              <div class="nx-stat-num">${data.registeredTournaments.length}</div>
              <div class="nx-stat-label"><i class="bi bi-shield-check text-cyan me-1"></i> Active Tournaments</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="nx-stat-card accent-purple h-100">
              <div class="nx-stat-num">${data.upcomingMatches.length}</div>
              <div class="nx-stat-label"><i class="bi bi-diagram-3 text-purple me-1"></i> Scheduled Duels</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="nx-stat-card accent-gold h-100">
              <div class="nx-stat-num">${data.completedTournaments.length}</div>
              <div class="nx-stat-label"><i class="bi bi-award-fill text-amber me-1"></i> Concluded Campaigns</div>
            </div>
          </div>
        </div>

        <!-- Enrolled Tournaments Table -->
        <div class="nx-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white font-tactical mb-0"><i class="bi bi-shield-check text-cyan me-2"></i> ENROLLED TOURNAMENTS</h5>
            <span class="text-muted font-tactical small">${data.registeredTournaments.length} ACTIVE BRACKETS</span>
          </div>

          <div class="table-responsive">
            <table class="table table-nexus align-middle mb-0">
              <thead>
                <tr>
                  <th>Tournament</th>
                  <th>Game Title</th>
                  <th>Deployment Date</th>
                  <th>Status</th>
                  <th class="text-end">Hub Action</th>
                </tr>
              </thead>
              <tbody>
                ${
                  data.registeredTournaments.length === 0
                    ? `<tr><td colspan="5" class="text-center text-muted font-tactical py-4">You are not currently enrolled in any active tournament. Explore open qualifiers in the directory.</td></tr>`
                    : data.registeredTournaments.map((t) => `
                    <tr>
                      <td class="fw-bold text-white">${t.name}</td>
                      <td class="text-muted font-tactical"><i class="bi bi-controller text-cyan me-1"></i> ${t.gameName}</td>
                      <td class="font-tactical">${formatDate(t.date)}</td>
                      <td>
                        <span class="nx-badge ${statusBadgeClass(t.status)}">
                          ${t.status === 'Ongoing' ? '<span class="pulse-dot"></span>' : ''} ${t.status}
                        </span>
                      </td>
                      <td class="text-end">
                        <a href="tournament-details.html?id=${t._id}" class="btn btn-nx-outline btn-sm">
                          Enter Hub <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                      </td>
                    </tr>
                    `).join('')
                }
              </tbody>
            </table>
          </div>
        </div>

        <!-- Player Upcoming Duels -->
        <div class="nx-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white font-tactical mb-0"><i class="bi bi-crosshair text-rose me-2"></i> UPCOMING MATCH DUELS</h5>
            <span class="text-muted font-tactical small">YOUR SCHEDULED MATCHUPS</span>
          </div>

          <div class="table-responsive">
            <table class="table table-nexus align-middle mb-0">
              <thead>
                <tr>
                  <th>Tournament</th>
                  <th>Opponent</th>
                  <th>Scheduled Date &amp; Time</th>
                  <th class="text-end">Match Center</th>
                </tr>
              </thead>
              <tbody>
                ${
                  data.upcomingMatches.length === 0
                    ? `<tr><td colspan="4" class="text-center text-muted font-tactical py-4">No pending matches scheduled at this time. Stay alert for bracket draws.</td></tr>`
                    : data.upcomingMatches.map((m) => {
                        const opponent = m.player1?._id === user._id ? m.player2?.name : m.player1?.name;
                        return `
                        <tr>
                          <td class="fw-bold text-white">${m.tournament?.name || '-'}</td>
                          <td class="text-cyan font-tactical fs-6"><i class="bi bi-person-fill me-1"></i> ${opponent || 'TBD'}</td>
                          <td class="font-tactical text-muted">${formatDate(m.matchDate)} @ ${m.matchTime}</td>
                          <td class="text-end">
                            <a href="matches.html?id=${m.tournament?._id}" class="btn btn-nx-outline btn-sm">
                              View Schedule <i class="bi bi-chevron-right ms-1"></i>
                            </a>
                          </td>
                        </tr>
                        `;
                      }).join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;
    } catch (err) {
      renderDashboardError(err);
    }
  }

  function renderDashboardError(err) {
    const isDbError = err.status === 503 || (err.message && err.message.toLowerCase().includes('database'));
    container.innerHTML = `
      <div class="nx-card p-4 p-md-5 mx-auto text-start" style="max-width: 680px; border-color: rgba(244, 63, 94, 0.4);">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="p-3 rounded-circle" style="background: rgba(244, 63, 94, 0.12); border: 1px solid var(--nx-rose-glow);">
            <i class="bi bi-shield-slash-fill text-rose fs-2"></i>
          </div>
          <div>
            <span class="nx-badge btn-nx-danger mb-1 font-tactical">TELEMETRY LINK OFFLINE</span>
            <h4 class="text-white mb-0 font-orbitron">Command Center Interrupted</h4>
          </div>
        </div>
        <p class="text-muted font-tactical mb-3" style="font-size: 1.05rem;">${err.message}</p>
        ${
          isDbError
            ? `
          <div class="p-3 rounded mb-3 font-tactical small" style="background: rgba(0,0,0,0.4); border: 1px solid var(--nx-border);">
            <div class="text-cyan fw-bold mb-1"><i class="bi bi-info-circle-fill me-1"></i> RESOLUTION:</div>
            <div class="text-muted">Ensure your current IP is whitelisted in your MongoDB Atlas cluster Network Access (allow 0.0.0.0/0).</div>
          </div>
        `
            : ''
        }
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-nx-outline btn-sm" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
          <button class="btn btn-nx-cyan btn-sm" onclick="user.role === 'organizer' ? loadOrganizerDashboard() : loadPlayerDashboard()"><i class="bi bi-lightning-charge-fill"></i> Retry</button>
        </div>
      </div>
    `;
  }

  if (user.role === 'organizer') {
    loadOrganizerDashboard();
  } else {
    loadPlayerDashboard();
  }
</script>
</body>
</html>

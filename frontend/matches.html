<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Operations & Duels // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <!-- Top Navigation & Action Header -->
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
    <div>
      <a id="backHubLink" href="tournaments.html" class="text-muted text-decoration-none font-tactical small d-block mb-1">
        <i class="bi bi-arrow-left me-1"></i> BACK TO TOURNAMENT HUB
      </a>
      <h2 class="fw-black text-white mb-0"><span class="text-cyan">//</span> MATCH CENTER &amp; DUELS</h2>
      <p class="text-muted font-tactical mb-0" id="tournamentTitleHeader">LOADING COMPETITIVE SCHEDULE...</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-nx-primary d-none" id="createMatchBtn" data-bs-toggle="modal" data-bs-target="#matchModal">
        <i class="bi bi-plus-circle-fill"></i> Schedule Duel
      </button>
    </div>
  </div>

  <!-- Matches Grid Container -->
  <div id="matchesContainer" class="row g-4 mb-4">
    <div class="nx-spinner-wrap w-100"><div class="nx-spinner"></div></div>
  </div>
</div>

<!-- Modal: Schedule Match Duel -->
<div class="modal fade" id="matchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="matchForm">
        <div class="modal-header">
          <h5 class="modal-title font-orbitron text-white">
            <i class="bi bi-diagram-3-fill text-cyan me-2"></i>SCHEDULE COMPETITIVE DUEL
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="matchId">
          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">BRACKET ROUND</label>
            <input type="text" class="form-control" id="round" placeholder="e.g. Round of 16, Quarterfinals, Grand Finals" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label font-tactical text-muted small">CONTENDER 1</label>
              <select class="form-select" id="player1" required></select>
            </div>
            <div class="col-6">
              <label class="form-label font-tactical text-muted small">CONTENDER 2</label>
              <select class="form-select" id="player2" required></select>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label font-tactical text-muted small">MATCH DATE</label>
              <input type="date" class="form-control" id="matchDate" required>
            </div>
            <div class="col-6">
              <label class="form-label font-tactical text-muted small">MATCH TIME</label>
              <input type="time" class="form-control" id="matchTime" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-nx-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-nx-cyan">Commit Match Schedule</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Scorekeeper / Result Certification -->
<div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="resultForm">
        <div class="modal-header">
          <h5 class="modal-title font-orbitron text-white">
            <i class="bi bi-award-fill text-amber me-2"></i>CERTIFY DUEL OUTCOME
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="resultMatchId">
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label font-tactical text-muted small" id="p1ScoreLabel">Player 1 Score</label>
              <input type="number" class="form-control text-center fs-4 font-orbitron" id="player1Score" min="0" required>
            </div>
            <div class="col-6">
              <label class="form-label font-tactical text-muted small" id="p2ScoreLabel">Player 2 Score</label>
              <input type="number" class="form-control text-center fs-4 font-orbitron" id="player2Score" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">CONFIRMED WINNER</label>
            <select class="form-select font-tactical fs-5" id="winner" required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-nx-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-nx-primary">Submit &amp; Sync Standings</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('dashboard');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');
  const user = Session.getUser();
  let isOwner = false;
  let approvedPlayers = [];

  async function init() {
    if (!tournamentId) {
      document.getElementById('matchesContainer').innerHTML = `
        <div class="col-12 text-center py-5">
          <div class="nx-card p-5 mx-auto" style="max-width: 500px;">
            <i class="bi bi-exclamation-triangle text-rose fs-1 mb-3"></i>
            <h4 class="text-white">Tournament Undefined</h4>
            <p class="text-muted small">Please select a tournament from the directory to inspect its match schedule.</p>
            <a href="tournaments.html" class="btn btn-nx-cyan btn-sm mt-2">Tournaments Directory</a>
          </div>
        </div>
      `;
      return;
    }

    document.getElementById('backHubLink').href = `tournament-details.html?id=${tournamentId}`;

    try {
      const tournament = await TournamentAPI.getById(tournamentId);
      document.getElementById('tournamentTitleHeader').textContent = `${tournament.name.toUpperCase()} // ${tournament.gameName.toUpperCase()}`;

      const organizerId = tournament.organizer?._id || tournament.organizer;
      isOwner = user && user.role === 'organizer' && user._id === organizerId;

      if (isOwner) {
        document.getElementById('createMatchBtn').classList.remove('d-none');

        // Load approved players
        const registrations = await RegistrationAPI.forTournament(tournamentId);
        approvedPlayers = registrations
          .filter((r) => r.status === 'Approved')
          .map((r) => r.player);

        const options = approvedPlayers
          .map((p) => `<option value="${p._id}">${p.name}</option>`)
          .join('');

        document.getElementById('player1').innerHTML = options || '<option disabled>No approved contenders available</option>';
        document.getElementById('player2').innerHTML = options || '<option disabled>No approved contenders available</option>';
      }

      await loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  async function loadMatches() {
    const container = document.getElementById('matchesContainer');
    try {
      const matches = await MatchAPI.forTournament(tournamentId);

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="nx-card p-5 mx-auto" style="max-width: 500px;">
              <i class="bi bi-calendar-x fs-1 text-muted mb-3 d-block"></i>
              <h4 class="text-white">No Match Duels Scheduled</h4>
              <p class="text-muted small mb-0">Match fixtures have not been assigned for this tournament bracket yet.</p>
              ${isOwner ? '<button class="btn btn-nx-primary btn-sm mt-3" data-bs-toggle="modal" data-bs-target="#matchModal"><i class="bi bi-plus-circle me-1"></i> Schedule First Duel</button>' : ''}
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = matches.map((m) => {
        const isCompleted = m.status === 'Completed';
        const p1IsWinner = isCompleted && m.winner && (m.winner._id === m.player1?._id || m.winner === m.player1?._id);
        const p2IsWinner = isCompleted && m.winner && (m.winner._id === m.player2?._id || m.winner === m.player2?._id);

        return `
        <div class="col-lg-6">
          <div class="nx-vs-card h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="nx-badge nx-badge-upcoming font-tactical">${m.round}</span>
              <span class="font-tactical text-muted small">
                <i class="bi bi-clock me-1"></i> ${formatDate(m.matchDate)} @ ${m.matchTime}
              </span>
              <span class="nx-badge ${statusBadgeClass(m.status)}">
                ${m.status === 'Ongoing' ? '<span class="pulse-dot"></span>' : ''} ${m.status}
              </span>
            </div>

            <!-- Versus Duel Presentation -->
            <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
              <!-- Player 1 Box -->
              <div class="nx-player-box ${p1IsWinner ? 'winner' : ''}">
                <div class="font-tactical text-muted small">CONTENDER 1</div>
                <div class="fw-bold fs-5 text-white text-truncate">${m.player1?.name || 'TBD'}</div>
                ${p1IsWinner ? '<div class="badge bg-success bg-opacity-25 text-emerald border border-success border-opacity-50 mt-1"><i class="bi bi-trophy-fill"></i> VICTOR</div>' : ''}
                <div class="display-6 fw-bold text-cyan mt-2 font-orbitron">${m.player1Score}</div>
              </div>

              <!-- VS Center Mark -->
              <div class="nx-vs-divider">VS</div>

              <!-- Player 2 Box -->
              <div class="nx-player-box ${p2IsWinner ? 'winner' : ''}">
                <div class="font-tactical text-muted small">CONTENDER 2</div>
                <div class="fw-bold fs-5 text-white text-truncate">${m.player2?.name || 'TBD'}</div>
                ${p2IsWinner ? '<div class="badge bg-success bg-opacity-25 text-emerald border border-success border-opacity-50 mt-1"><i class="bi bi-trophy-fill"></i> VICTOR</div>' : ''}
                <div class="display-6 fw-bold text-cyan mt-2 font-orbitron">${m.player2Score}</div>
              </div>
            </div>

            ${
              isOwner
                ? `
                <div class="text-end pt-2 border-top border-secondary border-opacity-25">
                  <button class="btn btn-nx-outline btn-sm" onclick="openResultModal('${m._id}', '${m.player1?._id}', '${m.player1?.name}', '${m.player2?._id}', '${m.player2?.name}')">
                    <i class="bi bi-clipboard2-pulse-fill text-amber me-1"></i> Certify Outcome
                  </button>
                </div>
                `
                : ''
            }
          </div>
        </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `
        <div class="col-12 text-center py-4">
          <div class="nx-card p-4 p-md-5 mx-auto text-start" style="max-width: 600px; border-color: rgba(244, 63, 94, 0.4);">
            <i class="bi bi-exclamation-octagon-fill text-rose fs-1 mb-2 d-block"></i>
            <h5 class="text-white font-orbitron mb-2">Match Roster Synchronization Interrupted</h5>
            <p class="text-muted font-tactical mb-3">${err.message}</p>
            <div class="d-flex gap-2 justify-content-end">
              <button class="btn btn-nx-outline btn-sm" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
              <button class="btn btn-nx-cyan btn-sm" onclick="loadMatches()"><i class="bi bi-lightning-charge-fill"></i> Retry</button>
            </div>
          </div>
        </div>
      `;
    }
  }

  document.getElementById('matchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      tournament: tournamentId,
      round: document.getElementById('round').value.trim(),
      player1: document.getElementById('player1').value,
      player2: document.getElementById('player2').value,
      matchDate: document.getElementById('matchDate').value,
      matchTime: document.getElementById('matchTime').value,
    };

    try {
      await MatchAPI.create(payload);
      showToast('Competitive duel fixture registered!', 'success');
      bootstrap.Modal.getInstance(document.getElementById('matchModal')).hide();
      e.target.reset();
      loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  function openResultModal(matchId, p1Id, p1Name, p2Id, p2Name) {
    document.getElementById('resultMatchId').value = matchId;
    document.getElementById('p1ScoreLabel').textContent = `${p1Name} SCORE`;
    document.getElementById('p2ScoreLabel').textContent = `${p2Name} SCORE`;
    document.getElementById('winner').innerHTML = `
      <option value="${p1Id}">${p1Name}</option>
      <option value="${p2Id}">${p2Name}</option>
    `;
    new bootstrap.Modal(document.getElementById('resultModal')).show();
  }

  document.getElementById('resultForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const matchId = document.getElementById('resultMatchId').value;
    const payload = {
      player1Score: Number(document.getElementById('player1Score').value),
      player2Score: Number(document.getElementById('player2Score').value),
      winner: document.getElementById('winner').value,
    };

    try {
      await MatchAPI.updateResult(matchId, payload);
      showToast('Duel certified! Dynamic leaderboard successfully synced.', 'success');
      bootstrap.Modal.getInstance(document.getElementById('resultModal')).hide();
      e.target.reset();
      loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  init();
</script>
</body>
</html>

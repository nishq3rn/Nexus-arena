<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modify Tournament Parameters // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="nx-badge nx-badge-gold mb-2">MODIFICATION PROTOCOL</span>
          <h2 class="fw-black text-white mb-0"><span class="text-cyan">//</span> EDIT TOURNAMENT PARAMETERS</h2>
        </div>
        <a href="dashboard.html" class="btn btn-nx-outline btn-sm">
          <i class="bi bi-arrow-left"></i> Command Center
        </a>
      </div>

      <div class="nx-card p-4 p-md-5">
        <div class="nx-card-header-accent mb-4"></div>

        <form id="tournamentForm" novalidate>
          <div class="mb-4">
            <h5 class="text-white font-tactical mb-3"><i class="bi bi-1-circle-fill text-cyan me-2"></i> DIRECTIVE INTEL</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label font-tactical text-muted small">TOURNAMENT TITLE</label>
                <input type="text" class="form-control" id="name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label font-tactical text-muted small">COMPETITIVE GAME</label>
                <input type="text" class="form-control" id="gameName" required>
              </div>
              <div class="col-12">
                <label class="form-label font-tactical text-muted small">DIRECTIVE OVERVIEW & COMPETITIVE RULES</label>
                <textarea class="form-control" id="description" rows="4" required></textarea>
              </div>
            </div>
          </div>

          <hr class="border-secondary border-opacity-25 my-4">

          <div class="mb-4">
            <h5 class="text-white font-tactical mb-3"><i class="bi bi-2-circle-fill text-purple me-2"></i> LOGISTICS & OPERATIONAL STATUS</h5>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label font-tactical text-muted small">SCHEDULED DATE</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="col-md-3">
                <label class="form-label font-tactical text-muted small">START TIME</label>
                <input type="time" class="form-control" id="time" required>
              </div>
              <div class="col-md-3">
                <label class="form-label font-tactical text-muted small">DEPLOYMENT MODE</label>
                <select class="form-select" id="venueType">
                  <option value="Online">Online Cloud Arena</option>
                  <option value="Offline">Physical LAN Stadium</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label font-tactical text-muted small">LIFECYCLE STATUS</label>
                <select class="form-select" id="status">
                  <option value="Upcoming">Upcoming Qualifiers</option>
                  <option value="Ongoing">Live in Progress</option>
                  <option value="Completed">Concluded Brackets</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label font-tactical text-muted small">VENUE / DISCORD / SERVER COORDINATES</label>
                <input type="text" class="form-control" id="venueDetails">
              </div>
            </div>
          </div>

          <hr class="border-secondary border-opacity-25 my-4">

          <div class="mb-4">
            <h5 class="text-white font-tactical mb-3"><i class="bi bi-3-circle-fill text-emerald me-2"></i> ROSTER & PRIZE MATRIX</h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label font-tactical text-muted small">MAX CONTENDERS (CAP)</label>
                <input type="number" class="form-control" id="maxPlayers" min="2" required>
              </div>
              <div class="col-md-4">
                <label class="form-label font-tactical text-muted small">ENTRY FEE (₹ / INR)</label>
                <div class="input-group">
                  <span class="input-group-text">₹</span>
                  <input type="number" class="form-control" id="entryFee" min="0">
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label font-tactical text-muted small">PRIZE POOL ALLOCATION (₹ / INR)</label>
                <div class="input-group">
                  <span class="input-group-text text-amber">₹</span>
                  <input type="number" class="form-control" id="prizePool" min="0">
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-nx-primary btn-lg w-100 justify-content-center mt-3" id="submitBtn">
            <i class="bi bi-save2-fill"></i> Commit Parameter Updates
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth('organizer');
  renderNavbar('dashboard');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');

  async function loadTournament() {
    if (!tournamentId) {
      showToast('No tournament specified.', 'danger');
      return;
    }
    try {
      const t = await TournamentAPI.getById(tournamentId);
      document.getElementById('name').value = t.name;
      document.getElementById('gameName').value = t.gameName;
      document.getElementById('description').value = t.description;
      document.getElementById('date').value = t.date.substring(0, 10);
      document.getElementById('time').value = t.time;
      document.getElementById('venueType').value = t.venueType;
      document.getElementById('status').value = t.status;
      document.getElementById('venueDetails').value = t.venueDetails || '';
      document.getElementById('maxPlayers').value = t.maxPlayers;
      document.getElementById('entryFee').value = t.entryFee;
      document.getElementById('prizePool').value = t.prizePool;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  document.getElementById('tournamentForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById('name').value.trim(),
      gameName: document.getElementById('gameName').value.trim(),
      description: document.getElementById('description').value.trim(),
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      venueType: document.getElementById('venueType').value,
      status: document.getElementById('status').value,
      venueDetails: document.getElementById('venueDetails').value.trim(),
      maxPlayers: Number(document.getElementById('maxPlayers').value),
      entryFee: Number(document.getElementById('entryFee').value) || 0,
      prizePool: Number(document.getElementById('prizePool').value) || 0,
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Updating...';

    try {
      await TournamentAPI.update(tournamentId, payload);
      showToast('Tournament parameters successfully committed.', 'success');
      setTimeout(() => (window.location.href = `tournament-details.html?id=${tournamentId}`), 700);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save2-fill"></i> Commit Parameter Updates';
    }
  });

  loadTournament();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamer Identity &amp; Profile // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <!-- Identity Card -->
      <div class="nx-card p-4 p-md-5">
        <div class="nx-card-header-accent mb-4"></div>

        <div class="text-center mb-4">
          <div class="position-relative d-inline-block">
            <div class="rounded-circle p-3 d-inline-block" style="background: rgba(0, 240, 255, 0.1); border: 2px solid var(--nx-cyan); box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);">
              <i class="bi bi-person-bounding-box text-cyan" style="font-size: 3.5rem;"></i>
            </div>
            <span class="position-absolute bottom-0 end-0 translate-middle p-2 bg-success border border-dark rounded-circle">
              <span class="visually-hidden">Online</span>
            </span>
          </div>

          <h3 class="text-white fw-black mt-3 mb-1" id="profileName">-</h3>
          <div class="d-flex justify-content-center gap-2 mt-2">
            <span class="nx-badge nx-badge-upcoming" id="profileRoleBadge">-</span>
            <span class="nx-badge nx-badge-ongoing"><span class="pulse-dot"></span> VERIFIED CREDENTIALS</span>
          </div>
        </div>

        <hr class="border-secondary border-opacity-25 my-4">

        <form id="profileForm" novalidate>
          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">OPERATIVE GAMERTAG / FULL NAME</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill text-cyan"></i></span>
              <input type="text" class="form-control" id="name" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">AUTHENTICATED EMAIL ADDRESS (PERMANENT ID)</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="email" class="form-control text-muted" id="email" disabled>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label font-tactical text-muted small">CONTACT PHONE / DISCORD BATTLETAG</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-discord text-cyan"></i></span>
              <input type="text" class="form-control" id="phone" placeholder="e.g. +91 9876543210 or Gamer#1234">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label font-tactical text-muted small">UPDATE ACCESS PASSWORD</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock-fill text-cyan"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Leave blank to retain current password" minlength="6">
            </div>
            <div class="form-text text-muted font-tactical small">Minimum 6 characters required if modifying passkey.</div>
          </div>

          <button type="submit" class="btn btn-nx-cyan btn-lg w-100 justify-content-center" id="saveBtn">
            <i class="bi bi-check2-circle"></i> Commit Profile Updates
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();
  renderNavbar('profile');

  async function loadProfile() {
    try {
      const me = await AuthAPI.me();
      document.getElementById('profileName').textContent = me.name;
      const roleText = me.role === 'organizer' ? '★ TOURNAMENT ORGANIZER' : '⚡ PRO CONTENDER';
      document.getElementById('profileRoleBadge').textContent = roleText;
      document.getElementById('name').value = me.name;
      document.getElementById('email').value = me.email;
      document.getElementById('phone').value = me.phone || '';
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
    };
    const password = document.getElementById('password').value;
    if (password) payload.password = password;

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Updating...';

    try {
      const updated = await UserAPI.updateProfile(payload);
      // Synchronize both nexus_user and ga_user
      const stored = Session.getUser();
      if (stored) {
        stored.name = updated.name;
        localStorage.setItem('nexus_user', JSON.stringify(stored));
        localStorage.setItem('ga_user', JSON.stringify(stored));
      }

      showToast('Gamer credentials successfully committed!', 'success');
      document.getElementById('profileName').textContent = updated.name;
      document.getElementById('password').value = '';
      renderNavbar('profile');
    } catch (err) {
      showToast(err.message, 'danger');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-check2-circle"></i> Commit Profile Updates';
    }
  });

  loadProfile();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Leaderboard // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
    <div>
      <a id="backHubLink" href="tournaments.html" class="text-muted text-decoration-none font-tactical small d-block mb-1">
        <i class="bi bi-arrow-left me-1"></i> BACK TO TOURNAMENT HUB
      </a>
      <h2 class="fw-black text-white mb-0"><span class="text-cyan">//</span> REAL-TIME STANDINGS</h2>
      <p class="text-muted font-tactical mb-0" id="tournamentTitleHeader">DYNAMIC MMR &amp; ROUND RANKINGS</p>
    </div>
    <div>
      <span class="nx-badge nx-badge-ongoing"><span class="pulse-dot"></span> LIVE SYNC ACTIVE</span>
    </div>
  </div>

  <!-- Top 3 Podium Container -->
  <div id="podiumContainer" class="row g-3 mb-5 align-items-end justify-content-center d-none">
    <!-- Rank 2 (Left) -->
    <div class="col-md-4 col-sm-4 order-2 order-sm-1">
      <div class="nx-podium-slot nx-podium-2">
        <div class="nx-crown-icon"><i class="bi bi-award-fill"></i></div>
        <div class="badge bg-secondary mb-2 font-tactical">#2 RUNNER-UP</div>
        <h4 class="text-white mb-1 text-truncate" id="p2Name">-</h4>
        <div class="text-muted font-tactical fs-5"><span class="text-cyan fw-bold" id="p2Points">0</span> PTS</div>
      </div>
    </div>
    <!-- Rank 1 (Center, Elevated) -->
    <div class="col-md-4 col-sm-4 order-1 order-sm-2">
      <div class="nx-podium-slot nx-podium-1">
        <div class="nx-crown-icon"><i class="bi bi-trophy-fill"></i></div>
        <div class="badge bg-warning text-dark mb-2 font-tactical fw-bold">#1 CHAMPION</div>
        <h3 class="text-white mb-1 text-truncate" id="p1Name">-</h3>
        <div class="text-muted font-tactical fs-5"><span class="text-gradient-gold fw-bold" id="p1Points">0</span> PTS</div>
      </div>
    </div>
    <!-- Rank 3 (Right) -->
    <div class="col-md-4 col-sm-4 order-3 order-sm-3">
      <div class="nx-podium-slot nx-podium-3">
        <div class="nx-crown-icon"><i class="bi bi-shield-shaded"></i></div>
        <div class="badge bg-secondary bg-opacity-75 mb-2 font-tactical">#3 CONTENDER</div>
        <h4 class="text-white mb-1 text-truncate" id="p3Name">-</h4>
        <div class="text-muted font-tactical fs-5"><span class="text-amber fw-bold" id="p3Points">0</span> PTS</div>
      </div>
    </div>
  </div>

  <!-- Detailed Standings Matrix Table -->
  <div class="nx-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="text-white font-tactical mb-0"><i class="bi bi-bar-chart-steps text-cyan me-2"></i> STANDINGS MATRIX</h5>
      <span class="text-muted font-tactical small" id="totalContendersLabel">LEADERBOARD ROSTER</span>
    </div>

    <div class="table-responsive">
      <table class="table table-nexus align-middle mb-0">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Contender</th>
            <th class="text-center">Matches</th>
            <th class="text-center">Victories</th>
            <th class="text-center">Defeats</th>
            <th class="text-center">Win Ratio</th>
            <th class="text-end">Total Points</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="7" class="text-center py-5"><div class="nx-spinner mx-auto"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');

  async function loadLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    if (!tournamentId) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center text-rose font-tactical py-4">
            No tournament specified in navigation parameters.
          </td>
        </tr>
      `;
      return;
    }

    document.getElementById('backHubLink').href = `tournament-details.html?id=${tournamentId}`;

    try {
      // Load tournament title
      try {
        const tournament = await TournamentAPI.getById(tournamentId);
        document.getElementById('tournamentTitleHeader').textContent = `${tournament.name.toUpperCase()} // OFFICIAL LEADERBOARD`;
      } catch (e) {}

      const rows = await LeaderboardAPI.forTournament(tournamentId);

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-muted font-tactical py-5">
              <i class="bi bi-bar-chart fs-2 mb-2 d-block text-muted"></i>
              No leaderboard telemetry recorded yet. Standings will populate as match results are certified.
            </td>
          </tr>
        `;
        return;
      }

      document.getElementById('totalContendersLabel').textContent = `${rows.length} CONTENDERS RANKED`;

      // Render Podium if at least 2 contenders have played
      if (rows.length >= 2 && rows[0].matchesPlayed > 0) {
        document.getElementById('podiumContainer').classList.remove('d-none');
        document.getElementById('p1Name').textContent = rows[0]?.player?.name || 'TBD';
        document.getElementById('p1Points').textContent = rows[0]?.points || 0;

        document.getElementById('p2Name').textContent = rows[1]?.player?.name || 'TBD';
        document.getElementById('p2Points').textContent = rows[1]?.points || 0;

        if (rows[2]) {
          document.getElementById('p3Name').textContent = rows[2]?.player?.name || 'TBD';
          document.getElementById('p3Points').textContent = rows[2]?.points || 0;
        }
      }

      tbody.innerHTML = rows.map((r) => {
        const winRatio = r.matchesPlayed > 0 ? Math.round((r.wins / r.matchesPlayed) * 100) : 0;
        const rankPill = r.rank === 1
          ? '<span class="nx-badge nx-badge-gold"><i class="bi bi-trophy-fill"></i> #1</span>'
          : r.rank === 2
          ? '<span class="nx-badge nx-badge-upcoming">#2</span>'
          : r.rank === 3
          ? '<span class="nx-badge nx-badge-completed">#3</span>'
          : `<span class="font-orbitron text-muted ms-2">#${r.rank}</span>`;

        return `
        <tr>
          <td>${rankPill}</td>
          <td class="fw-bold text-white fs-6">
            <i class="bi bi-person-circle text-cyan me-2"></i>${r.player?.name || 'Classified'}
          </td>
          <td class="text-center font-tactical fs-6">${r.matchesPlayed}</td>
          <td class="text-center font-tactical text-emerald fw-bold fs-6">${r.wins}</td>
          <td class="text-center font-tactical text-rose fs-6">${r.losses}</td>
          <td class="text-center font-tactical text-cyan fs-6">${winRatio}%</td>
          <td class="text-end font-orbitron text-gradient-gold fw-bold fs-5">${r.points}</td>
        </tr>`;
      }).join('');
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4">
            <div class="text-rose font-tactical mb-2">${err.message}</div>
            <button class="btn btn-nx-outline btn-sm" onclick="loadLeaderboard()"><i class="bi bi-arrow-clockwise me-1"></i> Retry Sync</button>
          </td>
        </tr>
      `;
    }
  }

  loadLeaderboard();
</script>
</body>
</html>

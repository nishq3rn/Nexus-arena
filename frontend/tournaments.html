<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournaments Directory // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <!-- Header Banner -->
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
    <div>
      <span class="nx-badge nx-badge-upcoming mb-2">COMPETITIVE CIRCUIT</span>
      <h2 class="fw-black text-white mb-1"><span class="text-cyan">//</span> TOURNAMENTS DIRECTORY</h2>
      <p class="text-muted font-tactical mb-0">DISCOVER, ENROLL, AND COMPETE IN ACTIVE ESPORTS BRACKETS</p>
    </div>
    <div id="organizerCreateBtn"></div>
  </div>

  <!-- Quick Game Chips -->
  <div class="d-flex flex-wrap gap-2 mb-4" id="gameChipsContainer">
    <span class="nx-filter-chip active" data-game="">All Games</span>
    <span class="nx-filter-chip" data-game="Valorant">Valorant</span>
    <span class="nx-filter-chip" data-game="Counter-Strike 2">Counter-Strike 2</span>
    <span class="nx-filter-chip" data-game="League of Legends">League of Legends</span>
    <span class="nx-filter-chip" data-game="Apex Legends">Apex Legends</span>
    <span class="nx-filter-chip" data-game="Rocket League">Rocket League</span>
    <span class="nx-filter-chip" data-game="Dota 2">Dota 2</span>
  </div>

  <!-- Advanced Search / Filters -->
  <div class="nx-card p-4 mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-lg-5 col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search text-cyan"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search by tournament or game title...">
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-controller text-cyan"></i></span>
          <input type="text" id="gameFilter" class="form-control" placeholder="Specific game name...">
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <select id="statusFilter" class="form-select">
          <option value="">All Operational Statuses</option>
          <option value="Upcoming">Upcoming Qualifiers</option>
          <option value="Ongoing">Live in Progress</option>
          <option value="Completed">Concluded Brackets</option>
        </select>
      </div>
      <div class="col-lg-1 col-md-6">
        <button id="searchBtn" class="btn btn-nx-cyan w-100">
          <i class="bi bi-funnel-fill"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Tournaments Grid -->
  <div id="tournamentsGrid" class="row g-4">
    <div class="nx-spinner-wrap w-100">
      <div class="nx-spinner"></div>
    </div>
  </div>

  <!-- Pagination -->
  <nav class="mt-5">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const user = Session.getUser();
  if (user && user.role === 'organizer') {
    document.getElementById('organizerCreateBtn').innerHTML = `
      <a href="create-tournament.html" class="btn btn-nx-primary">
        <i class="bi bi-plus-circle-fill"></i> Launch Tournament
      </a>
    `;
  }

  let currentPage = 1;

  // Handle URL query parameters (e.g. ?game=Valorant)
  const urlParams = new URLSearchParams(window.location.search);
  const initialGame = urlParams.get('game');
  if (initialGame) {
    document.getElementById('gameFilter').value = initialGame;
    document.querySelectorAll('.nx-filter-chip').forEach(chip => {
      if (chip.dataset.game.toLowerCase() === initialGame.toLowerCase()) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });
  }

  // Handle game chip clicks
  document.querySelectorAll('.nx-filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.nx-filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      document.getElementById('gameFilter').value = chip.dataset.game;
      loadTournaments(1);
    });
  });

  async function loadTournaments(page = 1) {
    currentPage = page;
    const grid = document.getElementById('tournamentsGrid');
    grid.innerHTML = `<div class="nx-spinner-wrap w-100"><div class="nx-spinner"></div></div>`;

    const params = { page, limit: 6 };
    const search = document.getElementById('searchInput').value.trim();
    const game = document.getElementById('gameFilter').value.trim();
    const status = document.getElementById('statusFilter').value;

    if (search) params.search = search;
    if (game) params.game = game;
    if (status) params.status = status;

    try {
      const data = await TournamentAPI.list(params);

      if (!data.tournaments || data.tournaments.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="nx-card p-5 mx-auto" style="max-width: 500px;">
              <i class="bi bi-slash-circle fs-1 text-muted mb-3 d-block"></i>
              <h4 class="text-white">No Tournaments Located</h4>
              <p class="text-muted small mb-0">No active competitive operations match your filter parameters. Try expanding your search criteria.</p>
            </div>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = data.tournaments.map((t) => {
        const isOnline = t.venueType === 'Online';
        const feeText = t.entryFee > 0 ? formatCurrency(t.entryFee) : 'FREE ENTRY';

        return `
        <div class="col-lg-4 col-md-6">
          <div class="nx-card h-100 d-flex flex-column">
            <div class="nx-card-header-accent"></div>
            <div class="p-4 d-flex flex-column flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="nx-badge ${statusBadgeClass(t.status)}">
                  ${t.status === 'Ongoing' ? '<span class="pulse-dot"></span>' : ''} ${t.status}
                </span>
                <span class="font-tactical text-muted small">
                  <i class="bi ${isOnline ? 'bi-globe-americas text-cyan' : 'bi-geo-alt-fill text-amber'} me-1"></i> ${t.venueType}
                </span>
              </div>

              <h4 class="text-white mb-2">${t.name}</h4>
              <div class="d-flex align-items-center text-muted font-tactical mb-3 small">
                <i class="bi bi-controller text-cyan me-2"></i> ${t.gameName}
              </div>

              <div class="nx-stat-card p-3 mb-3 bg-opacity-25" style="background: rgba(0, 0, 0, 0.3);">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="text-muted small font-tactical">PRIZE POOL</span>
                  <span class="text-gradient-gold fw-bold font-orbitron">${formatCurrency(t.prizePool)}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-muted small font-tactical">ENTRY FEE</span>
                  <span class="text-white fw-bold font-tactical">${feeText}</span>
                </div>
              </div>

              <div class="mt-auto">
                <div class="d-flex justify-content-between align-items-center text-muted small font-tactical mb-3">
                  <span><i class="bi bi-calendar3 me-1"></i> ${formatDate(t.date)}</span>
                  <span><i class="bi bi-clock me-1"></i> ${t.time}</span>
                  <span><i class="bi bi-people-fill me-1"></i> Max ${t.maxPlayers}</span>
                </div>
                <a href="tournament-details.html?id=${t._id}" class="btn btn-nx-outline w-100 justify-content-center">
                  Enter Tournament Hub <i class="bi bi-chevron-right ms-1"></i>
                </a>
              </div>
            </div>
          </div>
        </div>`;
      }).join('');

      renderPagination(data.page, data.totalPages);
    } catch (err) {
      const isDbError = err.status === 503 || (err.message && err.message.toLowerCase().includes('database')) || (err.message && err.message.includes('buffering timed out'));

      grid.innerHTML = `
        <div class="col-12 text-center py-4">
          <div class="nx-card p-4 p-md-5 mx-auto text-start" style="max-width: 680px; border-color: rgba(244, 63, 94, 0.4);">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="p-3 rounded-circle" style="background: rgba(244, 63, 94, 0.12); border: 1px solid var(--nx-rose-glow);">
                <i class="bi bi-database-fill-slash text-rose fs-2"></i>
              </div>
              <div>
                <span class="nx-badge btn-nx-danger mb-1 font-tactical">DATABASE LINK OFFLINE</span>
                <h4 class="text-white mb-0 font-orbitron">Nexus Data Core Disconnected</h4>
              </div>
            </div>

            <p class="text-muted font-tactical mb-3" style="font-size: 1.05rem;">
              ${err.message}
            </p>

            ${
              isDbError
                ? `
              <div class="p-3 rounded mb-4 font-tactical small" style="background: rgba(0, 0, 0, 0.4); border: 1px solid var(--nx-border);">
                <div class="text-cyan fw-bold mb-2"><i class="bi bi-info-circle-fill me-1"></i> RESOLUTION PROTOCOL (MONGODB ATLAS):</div>
                <ol class="text-muted mb-0 ps-3">
                  <li class="mb-1">Log in to your <strong>MongoDB Atlas Console</strong> (<a href="https://cloud.mongodb.com" target="_blank" class="text-cyan text-decoration-none">cloud.mongodb.com</a>).</li>
                  <li class="mb-1">Navigate to <strong>Security</strong> &rarr; <strong>Network Access</strong>.</li>
                  <li class="mb-1">Click <strong>Add IP Address</strong> and choose <strong>Allow Access From Anywhere (0.0.0.0/0)</strong> or add your current IP.</li>
                  <li>Click <strong>Confirm</strong> (takes ~1 minute to deploy). Then click the reconnect button below.</li>
                </ol>
              </div>
              `
                : ''
            }

            <div class="d-flex gap-2 justify-content-end">
              <button class="btn btn-nx-outline btn-sm" onclick="window.location.reload()">
                <i class="bi bi-arrow-clockwise"></i> Reload Terminal
              </button>
              <button class="btn btn-nx-cyan btn-sm" onclick="loadTournaments(1)">
                <i class="bi bi-lightning-charge-fill"></i> Retry Connection
              </button>
            </div>
          </div>
        </div>
      `;
    }
  }

  function renderPagination(current, total) {
    const ul = document.getElementById('pagination');
    if (total <= 1) {
      ul.innerHTML = '';
      return;
    }

    let html = '';
    html += `
      <li class="page-item ${current === 1 ? 'disabled' : ''}">
        <button class="page-link" onclick="loadTournaments(${current - 1})"><i class="bi bi-chevron-left"></i></button>
      </li>
    `;

    for (let i = 1; i <= total; i++) {
      html += `
        <li class="page-item ${i === current ? 'active' : ''}">
          <button class="page-link" onclick="loadTournaments(${i})">${i}</button>
        </li>
      `;
    }

    html += `
      <li class="page-item ${current === total ? 'disabled' : ''}">
        <button class="page-link" onclick="loadTournaments(${current + 1})"><i class="bi bi-chevron-right"></i></button>
      </li>
    `;

    ul.innerHTML = html;
  }

  document.getElementById('searchBtn').addEventListener('click', () => loadTournaments(1));
  document.getElementById('searchInput').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') loadTournaments(1);
  });
  document.getElementById('statusFilter').addEventListener('change', () => loadTournaments(1));

  loadTournaments(1);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Intelligence Hub // NEXUS ARENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5" id="detailsContainer">
  <div class="nx-spinner-wrap"><div class="nx-spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');
  const container = document.getElementById('detailsContainer');
  const user = Session.getUser();

  async function loadDetails() {
    if (!tournamentId) {
      container.innerHTML = `
        <div class="nx-card p-5 text-center mx-auto" style="max-width: 500px;">
          <i class="bi bi-exclamation-triangle text-rose fs-1 mb-3"></i>
          <h4 class="text-white">Tournament Unspecified</h4>
          <p class="text-muted small">No target tournament ID detected in navigation stream.</p>
          <a href="tournaments.html" class="btn btn-nx-cyan btn-sm mt-2">Return to Directory</a>
        </div>
      `;
      return;
    }

    try {
      const t = await TournamentAPI.getById(tournamentId);
      const approvedCount = t.approvedCount || 0;
      const slotsLeft = t.maxPlayers - approvedCount;
      const capacityPct = Math.min(100, Math.round((approvedCount / t.maxPlayers) * 100));

      let joinButton = '';
      if (user && user.role === 'player') {
        const canJoin = slotsLeft > 0 && t.status === 'Upcoming';
        joinButton = `
          <button class="btn ${canJoin ? 'btn-nx-cyan' : 'btn-secondary'} btn-lg" id="joinBtn" ${!canJoin ? 'disabled' : ''}>
            <i class="bi ${canJoin ? 'bi-shield-check' : 'bi-slash-circle'}"></i> 
            ${slotsLeft <= 0 ? 'Roster Capacity Filled' : t.status !== 'Upcoming' ? 'Registration Closed' : 'Enlist in Tournament'}
          </button>
        `;
      } else if (!user) {
        joinButton = `
          <a href="login.html" class="btn btn-nx-cyan btn-lg">
            <i class="bi bi-box-arrow-in-right"></i> Authenticate to Enlist
          </a>
        `;
      }

      let organizerActions = '';
      if (user && user.role === 'organizer' && user._id === (t.organizer._id || t.organizer)) {
        organizerActions = `
          <div class="nx-card p-4 mb-4 border-primary">
            <h5 class="text-white font-tactical mb-3"><i class="bi bi-gear-fill text-purple me-2"></i> ORGANIZER COMMAND</h5>
            <div class="d-flex flex-wrap gap-2">
              <a href="edit-tournament.html?id=${t._id}" class="btn btn-nx-outline btn-sm">
                <i class="bi bi-pencil-square"></i> Edit Directive
              </a>
              <a href="registrations.html?id=${t._id}" class="btn btn-nx-outline btn-sm">
                <i class="bi bi-person-lines-fill"></i> Review Applications
              </a>
              <a href="matches.html?id=${t._id}" class="btn btn-nx-outline btn-sm">
                <i class="bi bi-diagram-3"></i> Coordinate Matches
              </a>
              <button class="btn btn-nx-danger btn-sm" id="deleteBtn">
                <i class="bi bi-trash3-fill"></i> Terminate Tournament
              </button>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="mb-4">
          <a href="tournaments.html" class="text-muted text-decoration-none font-tactical small">
            <i class="bi bi-arrow-left me-1"></i> BACK TO TOURNAMENTS DIRECTORY
          </a>
        </div>

        <div class="row g-4">
          <!-- Main Tournament Intelligence Column -->
          <div class="col-lg-8">
            <div class="nx-card p-4 p-md-5 mb-4">
              <div class="nx-card-header-accent mb-4"></div>
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <span class="nx-badge ${statusBadgeClass(t.status)}">
                  ${t.status === 'Ongoing' ? '<span class="pulse-dot"></span>' : ''} ${t.status}
                </span>
                <span class="font-tactical text-cyan">
                  <i class="bi ${t.venueType === 'Online' ? 'bi-globe' : 'bi-geo-alt-fill'} me-1"></i> ${t.venueType.toUpperCase()}
                </span>
              </div>

              <h2 class="display-6 fw-bold text-white mb-2">${t.name}</h2>
              <p class="font-tactical text-muted fs-5 mb-4">
                <i class="bi bi-controller text-cyan me-2"></i> ${t.gameName}
              </p>

              <!-- Capacity Meter -->
              <div class="mb-4 p-3 rounded" style="background: rgba(0,0,0,0.25); border: 1px solid var(--nx-border);">
                <div class="d-flex justify-content-between font-tactical small mb-2">
                  <span class="text-muted">ROSTER CAPACITY</span>
                  <span class="text-cyan fw-bold">${approvedCount} / ${t.maxPlayers} SLOTS CONFIRMED (${capacityPct}%)</span>
                </div>
                <div class="nx-progress">
                  <div class="nx-progress-bar" style="width: ${capacityPct}%"></div>
                </div>
              </div>

              <div class="mb-4">
                <h5 class="text-white font-tactical"><span class="text-cyan">//</span> COMPETITIVE DIRECTIVE & RULES</h5>
                <p class="text-muted lead fs-6" style="white-space: pre-line;">${t.description}</p>
              </div>

              <hr class="border-secondary border-opacity-25 my-4">

              <!-- Key Tournament Metrics -->
              <div class="row g-3 text-center font-tactical">
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">SCHEDULED DATE</div>
                    <div class="text-white fw-bold fs-5 mt-1">${formatDate(t.date)}</div>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">DEPLOYMENT TIME</div>
                    <div class="text-white fw-bold fs-5 mt-1">${t.time}</div>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">VENUE / SERVER</div>
                    <div class="text-white fw-bold fs-5 mt-1">${t.venueType}${t.venueDetails ? ` (${t.venueDetails})` : ''}</div>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">ENTRY FEE</div>
                    <div class="text-white fw-bold fs-5 mt-1">${t.entryFee > 0 ? formatCurrency(t.entryFee) : 'FREE'}</div>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">TOTAL PRIZE POOL</div>
                    <div class="text-gradient-gold fw-bold fs-5 mt-1">${formatCurrency(t.prizePool)}</div>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="nx-stat-card p-3">
                    <div class="text-muted small">PLAYER CAP</div>
                    <div class="text-white fw-bold fs-5 mt-1">${t.maxPlayers} MAX</div>
                  </div>
                </div>
              </div>

              <div class="mt-4 pt-2">
                ${joinButton}
              </div>
            </div>

            ${organizerActions}
          </div>

          <!-- Sidebar Information & Navigation -->
          <div class="col-lg-4">
            <!-- Organizer Card -->
            <div class="nx-card p-4 mb-4">
              <span class="nx-badge nx-badge-gold mb-2">SANCTIONED HOST</span>
              <h5 class="text-white mb-1">${t.organizer?.name || 'Tournament Official'}</h5>
              <p class="text-muted font-tactical small mb-0"><i class="bi bi-envelope-check text-cyan me-1"></i> ${t.organizer?.email || 'nexus@network.gg'}</p>
            </div>

            <!-- Arena Quick Access Hub -->
            <div class="nx-card p-4">
              <h5 class="text-white font-tactical mb-3"><i class="bi bi-broadcast text-cyan me-2"></i> ARENA HUBS</h5>
              <div class="d-grid gap-2">
                <a href="matches.html?id=${t._id}" class="btn btn-nx-outline text-start">
                  <i class="bi bi-diagram-3-fill text-cyan me-2"></i> Match Schedule & Duels
                </a>
                <a href="leaderboard.html?id=${t._id}" class="btn btn-nx-outline text-start">
                  <i class="bi bi-bar-chart-steps text-purple me-2"></i> Live MMR Leaderboard
                </a>
                <a href="results.html?id=${t._id}" class="btn btn-nx-outline text-start">
                  <i class="bi bi-award-fill text-gradient-gold me-2"></i> Hall of Fame / Results
                </a>
              </div>
            </div>
          </div>
        </div>
      `;

      // Wire Join Action
      const joinBtn = document.getElementById('joinBtn');
      if (joinBtn) {
        joinBtn.addEventListener('click', async () => {
          joinBtn.disabled = true;
          try {
            await RegistrationAPI.join(tournamentId);
            showToast('Registration application dispatched! Awaiting organizer roster authorization.', 'success');
            joinBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Application Pending Review';
          } catch (err) {
            showToast(err.message, 'danger');
            joinBtn.disabled = false;
          }
        });
      }

      // Wire Delete Action
      const deleteBtn = document.getElementById('deleteBtn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (!confirm('CONFIRM TERMINATION: Are you sure you wish to delete this tournament? All associated brackets will be purged.')) return;
          try {
            await TournamentAPI.remove(tournamentId);
            showToast('Tournament terminated from the system.', 'success');
            setTimeout(() => (window.location.href = 'tournaments.html'), 800);
          } catch (err) {
            showToast(err.message, 'danger');
          }
        });
      }
    } catch (err) {
      container.innerHTML = `
        <div class="nx-card p-5 text-center mx-auto" style="max-width: 600px; border-color: rgba(244, 63, 94, 0.4);">
          <i class="bi bi-exclamation-octagon-fill text-rose fs-1 mb-3"></i>
          <h4 class="text-white font-orbitron">Operation Interrupted</h4>
          <p class="text-muted font-tactical fs-6 mb-3">${err.message}</p>
          <a href="tournaments.html" class="btn btn-nx-cyan btn-sm">Return to Tournaments Directory</a>
        </div>
      `;
    }
  }

  loadDetails();
</script>
</body>
</html>
